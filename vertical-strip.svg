<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc"><title id="title">Mäe tn 7 — контрольний розріз VS-2</title><desc id="desc">Проєктні товщини пропорційні; вертикальні переходи схематичні. Немає призначення анкерів, пожежних відсічок або отворів.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#246374"/></marker><pattern id="brick" width="70" height="35" patternUnits="userSpaceOnUse"><rect width="70" height="35" fill="#ced4cd" stroke="#a2aca4"/><path d="M35 0V35" stroke="#a2aca4"/></pattern></defs><rect width="1800" height="1320" fill="#fcfcf8"/><g font-family="Arial, sans-serif" fill="#203443"><text x="70" y="70" font-size="22" letter-spacing="3">СТРОЙКА / P-8/8/22 PP v04 / 08.10.2026</text><text x="70" y="126" font-size="42" font-weight="700">Один фасад — три різні переходи.</text><text x="70" y="168" font-size="22">VS-2: товщини пропорційні · висота й примикання схематичні · ВАРІАНТ ДЛЯ ЗВІРКИ</text><rect x="230" y="285" width="80" height="730" fill="url(#brick)"/><rect x="310" y="285" width="200" height="230" fill="#c4b77d" stroke="#7a8c8c" stroke-width="1"/><rect x="310" y="715" width="200" height="300" fill="#c4b77d" stroke="#7a8c8c" stroke-width="1"/><path d="M310 1045V1085 M510 1045V1085 M310 1070H510" stroke="#246374" fill="none"/><text x="410.0" y="1100" text-anchor="middle" font-size="20">100</text><rect x="1030" y="280" width="23" height="23" fill="#c4b77d" stroke="#809294"/><text x="1070" y="300" font-size="24">01 / 100 мм · перший шар вати</text><rect x="510" y="285" width="100" height="230" fill="#b69a65" stroke="#7a8c8c" stroke-width="1"/><rect x="510" y="715" width="100" height="300" fill="#b69a65" stroke="#7a8c8c" stroke-width="1"/><path d="M510 1045V1085 M610 1045V1085 M510 1070H610" stroke="#246374" fill="none"/><text x="560.0" y="1132" text-anchor="middle" font-size="20">50</text><rect x="1030" y="343" width="23" height="23" fill="#b69a65" stroke="#809294"/><text x="1070" y="363" font-size="24">02 / 50 мм · вертикальний брус + вата</text><rect x="610" y="285" width="100" height="230" fill="#d0bb88" stroke="#7a8c8c" stroke-width="1"/><rect x="610" y="715" width="100" height="300" fill="#d0bb88" stroke="#7a8c8c" stroke-width="1"/><path d="M610 1045V1085 M710 1045V1085 M610 1070H710" stroke="#246374" fill="none"/><text x="660.0" y="1100" text-anchor="middle" font-size="20">50</text><rect x="1030" y="406" width="23" height="23" fill="#d0bb88" stroke="#809294"/><text x="1070" y="426" font-size="24">03 / 50 мм · горизонтальний брус + вата</text><rect x="710" y="285" width="18" height="230" fill="#a7bdbe" stroke="#7a8c8c" stroke-width="1"/><rect x="710" y="715" width="18" height="300" fill="#a7bdbe" stroke="#7a8c8c" stroke-width="1"/><path d="M710 1045V1085 M728 1045V1085 M710 1070H728" stroke="#246374" fill="none"/><text x="719.0" y="1132" text-anchor="middle" font-size="20">9</text><rect x="1030" y="469" width="23" height="23" fill="#a7bdbe" stroke="#809294"/><text x="1070" y="489" font-size="24">04 / 9 мм · вітрогіпс</text><rect x="728" y="285" width="50" height="230" fill="#f1f5ef" stroke="#7a8c8c" stroke-width="1"/><rect x="728" y="715" width="50" height="300" fill="#f1f5ef" stroke="#7a8c8c" stroke-width="1"/><path d="M728 1045V1085 M778 1045V1085 M728 1070H778" stroke="#246374" fill="none"/><text x="753.0" y="1100" text-anchor="middle" font-size="20">25</text><rect x="1030" y="532" width="23" height="23" fill="#f1f5ef" stroke="#809294"/><text x="1070" y="552" font-size="24">05 / 25 мм · вертикальна рейка / вентканал</text><rect x="778" y="285" width="16" height="230" fill="#dcd2be" stroke="#7a8c8c" stroke-width="1"/><rect x="778" y="715" width="16" height="300" fill="#dcd2be" stroke="#7a8c8c" stroke-width="1"/><path d="M778 1045V1085 M794 1045V1085 M778 1070H794" stroke="#246374" fill="none"/><text x="786.0" y="1132" text-anchor="middle" font-size="20">8</text><rect x="1030" y="595" width="23" height="23" fill="#dcd2be" stroke="#809294"/><text x="1070" y="615" font-size="24">06 / 8 мм · фіброцемент</text><rect x="290" y="515" width="120" height="200" fill="#d1e4ea" stroke="#466e7e" stroke-width="6"/><path d="M290 565H410M290 665H410" stroke="#466e7e" stroke-width="5"/><path d="M400 708L808 727L824 748" stroke="#527681" stroke-width="7" fill="none"/><path d="M807 999V751 M807 507V304" stroke="#246374" stroke-width="6" marker-end="url(#arrow)" fill="none"/><path d="M275 265L400 210L890 300" stroke="#485a64" stroke-width="10" fill="none"/><path d="M290 275L405 233L865 318" stroke="#b69763" stroke-width="10" fill="none"/><rect x="230" y="1015" width="80" height="155" fill="url(#brick)"/><rect x="310" y="1015" width="200" height="155" fill="#e4e8d6"/><rect x="510" y="1015" width="100" height="155" fill="#d2d7ba"/><rect x="610" y="1015" width="50" height="155" fill="#8a9ba0"/><rect x="660" y="1015" width="16" height="155" fill="#4a555b"/><path d="M650 1005L825 1017L830 1035" stroke="#527681" stroke-width="6" fill="none"/><path d="M90 530H280 M90 717H280" stroke="#b16a42" stroke-dasharray="7 7"/><text x="72" y="488" font-size="22" fill="#a7522d">Віконний вузол</text><text x="72" y="758" font-size="18">Арк.14 / PDF62</text><text x="1030" y="755" font-size="28" font-weight="700">Вікно / вода / герметизація</text><text x="1030" y="796" font-size="22">Рамка50×175 та локальний RKL31 — арк.14.</text><text x="1030" y="830" font-size="22">Відлив0,6 мм: торці, ухил і винос уточнити.</text><text x="1030" y="864" font-size="22" fill="#a7522d">RKL31 не проклеювати стрічкою — ISOVER.</text><text x="1030" y="930" font-size="28" font-weight="700">Цоколь VS-1 / арк.09</text><text x="1030" y="970" font-size="22">EPS120 Perimeeter100 + 50, брус50×75.</text><text x="1030" y="1004" font-size="22">Профіль25мм горизонтальний, плита8мм.</text><text x="1030" y="1038" font-size="22">Вхід повітря й вода крізь профілі: робочий вузол.</text><text x="1030" y="1100" font-size="28" font-weight="700">Дах / арк.12</text><text x="1030" y="1139" font-size="22">Крокви → підкладка →32×50→32×100→0,6мм.</text><text x="1030" y="1173" font-size="22">450мм вати — на горищному перекритті.</text><text x="260" y="1230" font-size="26" font-weight="700">100 + 50 + 50 + 9 + 25 + 8 = 242 мм</text><text x="260" y="1268" font-size="18">Без допусків, вирівнювання та системних стрічок; існуюча стіна не входить.</text><text x="70" y="1300" font-size="16" fill="#a7522d">Схема не замінює чинний робочий вузол. Вітер, анкери, пожежні відсічки, отвори й рух не розраховані.</text></g></svg>