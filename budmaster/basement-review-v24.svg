<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 910" role="img" aria-labelledby="title desc"><title id="title">Mäe tn 7: retained basement windows — V24 review</title><desc id="desc">Six southeast and six northwest graphic window envelopes; not surveyed dimensions or a cutting instruction.</desc><rect width="1400" height="910" fill="#f6f8f7"/><style>text{font-family:Arial,sans-serif;fill:#152932}.head{font-size:30px;font-weight:bold}.body{font-size:19px}.small{font-size:16px}.muted{fill:#52666b}.strip{fill:#49585b;stroke:#152932}.window{fill:#b8d5df;stroke:#f2f5f2;stroke-width:3}</style><text x="50" y="56" class="head">MÄE TN 7 / ЦОКОЛЬ / V24</text><text x="50" y="90" class="body">12 існуючих вікон залишаються · нових до закупівлі: 0</text><text x="50" y="123" class="small muted">Графічні зовнішні рамки з PDF53; не обмір будівельних прорізів. Кандидат для звірки.</text><text x="50" y="170" class="body">ПдСх · входи · зовнішній вигляд, зліва направо</text><rect x="70" y="190" width="1260" height="20.805604203152367" class="strip"/><line x1="70" x2="1330" y1="190" y2="190" stroke="#3b94bd" stroke-dasharray="6 4"/><rect x="92.04856330081591" y="190" width="56.1509311801518" height="18.616886273633273" class="window"/><text x="120.12402889089186" y="240" text-anchor="middle" class="small">G1</text><rect x="415.74216657463234" y="190" width="56.15093118015183" height="18.616886273633273" class="window"/><text x="443.81763216470824" y="240" text-anchor="middle" class="small">G2</text><rect x="509.72741502055504" y="190" width="56.05084039373451" height="18.616886273633273" class="window"/><text x="537.7528352174222" y="240" text-anchor="middle" class="small">G3</text><rect x="831.3191117796065" y="190" width="56.1509311801518" height="18.616886273633273" class="window"/><text x="859.3945773696823" y="240" text-anchor="middle" class="small">G4</text><rect x="925.2042694391117" y="190" width="56.15093118015197" height="18.616886273633273" class="window"/><text x="