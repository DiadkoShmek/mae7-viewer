ENT-SE-G01 · -18.3950 · 1781.2 × 590.6</text><text x="50" y="577" class="body">BASEMENT-SE-G02 · -8.1267 · 1781.2 × 590.6</text><text x="50" y="611" class="body">BASEMENT-SE-G03 · -5.1468 · 1778.1 × 590.6</text><text x="50" y="645" class="body">BASEMENT-SE-G04 · 5.0564 · 1781.2 × 590.6</text><text x="50" y="679" class="body">BASEMENT-SE-G05 · 8.0346 · 1781.2 × 590.6</text><text x="50" y="713" class="body">BASEMENT-SE-G06 · 18.6363 · 1781.2 × 590.6</text><text x="725" y="543" class="body">BASEMENT-NW-G01 · -14.5705 · 1778.1 × 590.6</text><text x="725" y="577" class="body">BASEMENT-NW-G02 · -11.5002 · 1778.1 × 590.6</text><text x="725" y="611" class="body">BASEMENT-NW-G03 · -1.4494 · 1781.2 × 590.6</text><text x="725" y="645" class="body">BASEMENT-NW-G04 · 1.6209 · 1781.2 × 590.6</text><text x="725" y="679" class="body">BASEMENT-NW-G05 · 11.6510 · 1781.2 × 590.6</text><text x="725" y="713" class="body">BASEMENT-NW-G06 · 14.7214 · 1781.2 × 590.6</text><text x="50" y="782" class="small muted">X локальний від середини кожного фасаду; для ПнЗх світовий X має протилежний знак.</text><text x="50" y="816" class="small muted">Джерела: PDF5 / §5.7 — залишити вікна; PDF53 / арк05 — рамки; PDF63 / арк15 — вузол.</text><text x="50" y="850" class="body">Зарізи, опори, відливи й посадка: до обміру та погодження.</text><text x="50" y="884" class="small muted">Площа моделі не змінює проєктні 76м² R76. Це лист звірки, не дозвіл різання.</text></svg>
